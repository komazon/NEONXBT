[metadata]
name = n2xbt
version = 1.3.1
author = komazon
author_email = uuu993421@gmail.com
project_urls =
    Code = https://github.com/komazon/neo_nxbt
    Issue tracker = https://github.com/komazon/neo_nxbt/issues
license = MIT
license_files = LICENSE
description = Control your Nintendo Switch through a website, terminal, or macro.
long_description = file: README.md
long_description_content_type = text/markdown
platform = any
classifiers = 
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
	Programming Language :: Python :: 3.11
	Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = n2xbt
include_package_data = true
python_requires = >= 3.11
zip_safe = False

[options.entry_points]
console_scripts =
    n2xbt = n2xbt.cli:main

[aliases]
# Alias `setup.py test` to `setup.py pytest`
test = pytest

[tool:pytest]
testpaths = tests
filterwarnings =
    error

[flake8]
max-line-length = 100
exclude =  .git, .eggs, __pycache__, tests/, docs/, build/, dist/